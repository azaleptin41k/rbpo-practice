name: Java Build and SAST

on:
  pull_request:
    branches: [ main ]

jobs:
  # Этап 1: Сборка (из задания №2)
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.6-eclipse-temurin-21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Если тесты есть, они запустятся здесь. Если нет - просто сборка.
      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-jar
          path: target/*.jar

  # Этап 2: Тестирование безопасности (SAST) (из задания №3)
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build # Ждем окончания сборки
    container:
      image: returntocorp/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # config=auto подберет правила сам. sarif для отчета.
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif

      - name: Upload SARIF result
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
      - name: Archive SARIF report
        uses: actions/upload-artifact@v4
        if: always() # Выполнить, даже если сканирование найдет ошибки
        with:
          name: semgrep-report  # Имя будущего артефакта
          path: semgrep.sarif   # Файл, который мы хотим сохранить
    # Новая работа для SCA
  # Новая работа для SCA
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build # Запускаем после сборки
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Запуск анализатора
      - name: Run Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DsuppressionFile=suppression.xml -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      # Требование: сохраните отчёт с помощью actions/upload-artifact@v4
      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html